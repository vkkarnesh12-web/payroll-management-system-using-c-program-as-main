<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Payroll Management System</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-background">
        <div class="shape shape1"></div>
        <div class="shape shape2"></div>
        <div class="shape shape3"></div>
    </div>

    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>💼 Payroll Management</h1>
                <p>Reset your account password</p>
            </div>

            <form id="forgotForm" class="auth-form">
                <h2>Forgot Password?</h2>
                <div class="form-group">
                    <label for="forgotEmail">Email Address</label>
                    <input type="email" id="forgotEmail" placeholder="Enter your registered email" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" minlength="6" placeholder="Enter new password" required>
                </div>
                <button type="submit" class="btn-login">Reset Password</button>
                <div id="forgotMessage" class="success-message" style="display:none;"></div>
                <div id="forgotError" class="error-message" style="display:none;"></div>
                <div class="form-footer">
                    <p><a href="login.html">Back to Login</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
