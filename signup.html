<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Payroll Management System</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-background">
        <div class="shape shape1"></div>
        <div class="shape shape2"></div>
        <div class="shape shape3"></div>
    </div>

    <div class="auth-container">
        <div class="auth-box signup-box">
            <div class="auth-header">
                <h1>💼 Payroll Management</h1>
                <p>Create Your Account</p>
            </div>

            <form id="signupForm" class="auth-form">
                <h2>Create New Account</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label for="signupFirstName">First Name</label>
                        <input type="text" id="signupFirstName" placeholder="Enter first name" required>
                    </div>
                    <div class="form-group">
                        <label for="signupLastName">Last Name</label>
                        <input type="text" id="signupLastName" placeholder="Enter last name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="signupCompany">Company Name</label>
                    <input type="text" id="signupCompany" placeholder="Enter company name" required>
                </div>

                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" placeholder="Enter password (min 6 characters)" required>
                    <span id="passwordStrength"></span>
                </div>

                <div class="form-group">
                    <label for="signupConfirmPassword">Confirm Password</label>
                    <input type="password" id="signupConfirmPassword" placeholder="Confirm your password" required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="agreeTerms">
                    <label for="agreeTerms">I agree to the Terms and Conditions and Privacy Policy</label>
                </div>

                <button type="submit" class="btn-signup">Create Account</button>

                <div id="signupError" class="error-message" style="display:none;"></div>
                <div id="signupSuccess" class="success-message" style="display:none;"></div>

                <div class="form-footer">
                    <p>Already have an account? <a href="login.html">Login here</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
